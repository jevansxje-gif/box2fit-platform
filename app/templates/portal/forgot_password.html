{% extends "base.html" %}
{% block title %}Reset password — Box2Fit{% endblock %}
{% block content %}
<div class="flow" style="max-width:440px">
  <h1>Reset your password</h1>
  <p class="lede">Enter your account email and we'll send you a link to choose a new password. Works for members, coaches and staff.</p>
  <form method="post" class="pf-panel" style="margin-top:0">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    <div class="pf-field">
      <label class="pf-label" for="email">Email</label>
      <input class="pf-input" id="email" name="email" type="email" autocomplete="username" required />
    </div>
    <button class="pf-btn pf-btn--primary pf-btn--block" type="submit">Email me a password link</button>
    <p class="pf-hint" style="margin-top:12px;text-align:center"><a href="{{ url_for('portal.login') }}">Back to sign-in</a></p>
  </form>
</div>
{% endblock %}
