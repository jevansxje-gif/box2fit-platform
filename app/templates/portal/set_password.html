{% extends "base.html" %}
{% block title %}Set your password — Box2Fit{% endblock %}
{% block content %}
<div class="flow" style="max-width:440px">
  <h1>Welcome, {{ user.name.split(' ')[0] }}!</h1>
  <p class="lede">Set a password for your member account. You can always use email sign-in links instead.</p>
  <form method="post" class="pf-panel" style="margin-top:0">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    <div class="pf-field">
      <label class="pf-label" for="password">Choose a password (8+ characters)</label>
      <input class="pf-input" id="password" name="password" type="password" autocomplete="new-password" minlength="8" required />
    </div>
    <button class="pf-btn pf-btn--primary pf-btn--block" type="submit">Save &amp; sign in</button>
  </form>
</div>
{% endblock %}
