faqs:
  - q: "I sit at a desk all day. Am I fit enough for this?"
    a: "Yes — everything scales. You work at your pace against your own numbers, and coaches adjust every station to your level."
  - q: "Do I need boxing experience?"
    a: "None. Bootcamp is conditioning built on boxing movements — if you want to learn the sport itself, that's our 6 PM Technical Boxing class."
  - q: "What should I bring?"
    a: "Comfortable athletic clothing, indoor training shoes, and a water bottle. Gloves and wraps can be provided."
