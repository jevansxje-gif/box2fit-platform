hero_video: hero-adults
short_name: "Bootcamp sessions"
objections_headline: "Straight answers, before you decide."
objections:
  - key: b1
    q: "I don't have time."
    a: "5 PM, 45 minutes, done by 5:45. It's on the calendar, not on your willpower. Three a week is plenty; come to more if you want."
    proof: "About half of inactive adults name time first. A fixed slot beats a promise of flexibility."
  - key: b2
    q: "I wouldn't know what to do."
    a: "You never have to guess. A coach runs every round: what to hit, how hard, when to rest. Nobody is left to work it out alone at a machine."
    proof: "60% of gym-goers say not knowing what to do is their biggest worry."
  - key: b3
    q: "I'm not fit enough to start."
    a: "Everything scales. Your first week is free, and the coach pitches every round to where you are, not where a class assumes you are."
    proof: "37% of non-exercisers feel too unhealthy to begin. That is who this is built for."
  - key: b4
    q: "I've quit gyms before."
    a: "Gym memberships fail because nobody notices when you stop coming. Here it's the same coach and the same crew every session, and they do notice."
    proof: "Coached small groups keep 84% of sessions vs 69% for self-directed training."
  - key: g7
    q: "Boxing is for fighters."
    a: "No sparring. No head contact. Gloves, pads, bags and footwork. The best 45 minutes of cardio you'll do this week, and you learn a skill doing it."
    proof: "Non-contact boxing: lower stress and higher confidence in 15 of 16 studies reviewed."
  - key: b6
    q: "Why not just do a HIIT class?"
    a: "Same price as the studios down the road, except you leave knowing how to throw a proper 1-2. A skill you can see improve is the thing that keeps people coming back."
    proof: "$189 every 4 weeks, the going rate for coached small groups in South Surrey."
