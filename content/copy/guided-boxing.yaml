coach_headline: "You never have to guess."
coach_body: "The thing that empties gyms is not laziness, it is not knowing what to do and nobody noticing when you stop coming. Here a coach runs the room, pitches each round to where you are, and knows your name by the second visit."
coach_photo: hero-battle-ropes-logo.jpg
faqs:
  - q: "Which hour should I pick?"
    a: "If you want to get fit and burn the day off, 5 PM. If you want to learn to box properly, 6 PM. If you want a start date, a goal and a small group that starts together, the 6 AM Challenge. Your free week works at 5 PM and 6 PM; come to both and decide."
  - q: "I sit at a desk all day. Am I fit enough for this?"
    a: "Yes. Everything scales. You work at your pace against your own numbers, and the coach adjusts every round to your level."
  - q: "Do I need boxing experience?"
    a: "None. Nobody spars and nobody gets hit in the head. Gloves, pads, bags and footwork."
  - q: "What should I bring?"
    a: "Comfortable athletic clothing, indoor training shoes and a water bottle. Gloves and wraps are provided for your free week."
  - q: "Where are you located?"
    a: "1522 Finlay Street, Unit 216, White Rock. Free underground parking. Start your free week below."
