faqs:
  - q: "I've never boxed. Is this over my head?"
    a: "No — beginners are the point. Everything starts from the fundamentals, and the coaches level every drill to where you are."
  - q: "Will I get hit?"
    a: "No. Technical Boxing is bags, pads and drills. Sparring is never part of this class and nothing here is contact for beginners."
  - q: "How is this different from Boxing Bootcamp?"
    a: "Bootcamp is conditioning first — the workout. Technical is skill first — the sport. Plenty of members do both."
  - q: "Where are you located?"
    a: "1522 Finlay Street, Unit 216, White Rock. Book your free first class below."
