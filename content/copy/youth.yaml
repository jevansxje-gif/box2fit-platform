faqs:
  - q: "My teen has never done a sport. Will they cope?"
    a: "Yes. Everything is taught from zero and nobody spars or gets hit — beginners work bags, pads and footwork. Most of our members started with no sport background."
  - q: "Is it safe?"
    a: "Youth sessions are structured, supervised and non-contact for beginners. It's boxing training — fitness, skills and discipline — not fighting."
  - q: "My kid is glued to their phone. Honestly, will this stick?"
    a: "This is the hour the phone stays in the bag — and because progress is visible week to week, this is the class teens ask to come back to."
  - q: "Where are you located?"
    a: "1522 Finlay Street, Unit 216, White Rock. Book their free first week below."
